<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">BASIC DEMO PROJECT</p>
    <h1>Habit Tracker</h1>

    <form id="form">
      <input id="habit" placeholder="e.g. Read 20 pages" required>
      <button>Add Habit</button>
    </form>

    <section id="list"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
