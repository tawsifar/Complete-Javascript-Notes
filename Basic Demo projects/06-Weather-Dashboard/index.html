<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">API DEMO PROJECT</p>
    <h1>Weather Dashboard</h1>
    <p>Search a city and view current weather information.</p>
    <form id="form">
      <input id="city" placeholder="City name, e.g. Dhaka" required>
      <button>Search</button>
    </form>
    <section id="weather" class="card">
      <h2>Ready to search</h2>
      <p>Enter a city above.</p>
    </section>
    <small class="note">Uses the Open-Meteo public APIs. No API key is required.</small>
  </main>
  <script src="script.js"></script>
</body>
</html>
