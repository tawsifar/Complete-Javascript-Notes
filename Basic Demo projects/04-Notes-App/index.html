<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">BASIC DEMO PROJECT</p>
    <h1>QuickNotes</h1>
    <p class="subtitle">A simple local notes workspace.</p>

    <form id="form" class="composer">
      <input id="title" placeholder="Note title" required>
      <textarea id="body" placeholder="Write something useful..." required></textarea>
      <button>Add Note</button>
    </form>

    <section id="notes" class="notes"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
